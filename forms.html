<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <style>
      body {
        background-image: url("https://c4.wallpaperflare.com/wallpaper/574/659/827/latest-spiderman-homecoming-spidy-wallpaper-preview.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .login-container {
        width: 30%;
        background-color: rgba(255, 255, 255, 0.2); /* Transparent effect */
        backdrop-filter: blur(10px); /* Blur effect */
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
        padding: 20px;
        border-radius: 15px;
        font-size: large;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: Arial, sans-serif;
        color: black;
      }
      input {
        width: 200px;
        height: 35px;
        border-radius: 5px;
        border: 1px soli gray;
        padding-left: 10px;
        background: rgba(255, 255, 255, 0.3);
        color: black;
      }
      input::placeholder {
        font-size: medium;
        color: black;
      }
      button {
        width: 100%;
        height: 40px;
        background-color: rgb(251, 249, 249);
        color: black;
        border: none;
        border-radius: 10px;
        font-size: large;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }
      button:hover {
        background-color: black;
      }
      td {
        padding-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>Login Here</h1>
      <form>
        <table>
          <tr>
            <td><label for="na">Name</label></td>
            <td><input type="text" id="na" placeholder="Enter your name" /></td>
          </tr>
          <tr>
            <td><label for="emm">Email</label></td>
            <td>
              <input type="email" id="emm" placeholder="Enter your email" />
            </td>
          </tr>
          <tr>
            <td><label for="pa">Password</label></td>
            <td>
              <input
                type="password"
                id="pa"
                placeholder="Enter your password"
              />
            </td>
          </tr>
          <tr>
            <td colspan="2" style="text-align: center">
              <button type="submit">Login</button>
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
</html>
